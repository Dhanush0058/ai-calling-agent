name: FastAPI CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_calling_agent

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_NAME: AI Calling Agent
      APP_VERSION: 1.0.0
      HOST: 127.0.0.1
      PORT: 8000
      DEBUG: True

      DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/ai_calling_agent

      SECRET_KEY: github-actions-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reset test database and run Alembic migrations
        run: |
          until mysqladmin ping --protocol=TCP -h 127.0.0.1 -proot --silent; do sleep 1; done
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot -proot -e "DROP DATABASE IF EXISTS ai_calling_agent; CREATE DATABASE ai_calling_agent;"
          alembic upgrade head
          alembic current

      - name: Run Tests
        run: |
          pytest -v

      - name: Coverage
        run: |
          pytest --cov=app --cov-report=term-missing