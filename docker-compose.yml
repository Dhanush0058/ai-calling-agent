services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-calling-agent

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/ai_calling_agent

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped

    volumes:
      - .:/app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  mysql:
    image: mysql:8.0

    container_name: mysql-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_calling_agent

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data: